<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>G.L.A.C.I.E.R.</title>
  <meta name="description"
    content="Glacial Lake Outburst Flood Simulation Platform — interactive 3D flood propagation modelling." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap"
    rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
    rel="stylesheet">
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --accent: #00c8ff;
      --accent2: #0077cc;
      --text: #ffffff;
      --dim: rgba(255, 255, 255, 0.40);
    }

    html,
    body {
      width: 100%;
      height: 100%;
      background: #050505;
      color: var(--text);
      font-family: 'Inter', sans-serif;
      overflow: hidden;
    }

    /* ── Full-page star canvas ───────────── */
    #stars {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }

    /* ── Root layout ─────────────────────── */
    #app {
      position: relative;
      z-index: 1;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: stretch;
    }

    /* ── LEFT PANEL ───────────────────────── */
    #left-panel {
      width: 45%;
      min-width: 320px;
      max-width: 680px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 48px 40px 48px 52px;
      overflow-y: auto;
      z-index: 5;
    }

    /* Scrollbar styling for left panel */
    #left-panel::-webkit-scrollbar {
      width: 3px;
    }

    #left-panel::-webkit-scrollbar-thumb {
      background: rgba(0, 200, 255, 0.25);
      border-radius: 3px;
    }

    .logo {
      font-family: 'Orbitron', monospace;
      /* font-size: clamp(2.8rem, 4.5vw, 4.2rem); */
      font-size: 65px;
      font-weight: 900;
      letter-spacing: 0.06em;
      white-space: nowrap;
      background: white;
      /* linear-gradient(135deg, #fff 0%, var(--accent) 55%, var(--accent2) 100%) */
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      user-select: none;
      margin-bottom: 10px;
      animation: fadeUp 1s ease both;
    }

    .fullform {
      font-size: 0.87rem;
      font-family: 'Poppins';
      letter-spacing: 0.04em;
      color: rgba(230, 243, 255, 0.7);
      text-transform: uppercase;
      line-height: 1.85;
      white-space: nowrap;
      margin-bottom: 32px;
      animation: fadeUp 1.1s ease both;
    }

    .separator {
      width: 80%;
      height: 1px;
      background: linear-gradient(90deg, var(--accent), transparent);
      margin-bottom: 34px;
      opacity: 0.3;
      animation: fadeUp 1.2s ease both;
    }

    /* ── Search / Dropdown ───────────────── */
    .search-label {
      font-size: 0.72rem;
      letter-spacing: 0.16em;
      color: rgba(255, 255, 255, 0.5);
      text-transform: uppercase;
      margin-bottom: 12px;
      animation: fadeUp 1.3s ease both;
    }

    #search-wrap {
      position: relative;
      animation: fadeUp 1.35s ease both;
    }

    #search-pill {
      width: 90%;
      height: 52px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 999px;
      display: flex;
      align-items: center;
      padding: 0 14px 0 20px;
      gap: 12px;
      cursor: text;
      backdrop-filter: blur(12px);
      transition: all 0.3s ease;
    }

    /* Force the inline SVG icons to be pure white */
    #search-pill svg {
      stroke: rgba(255, 255, 255, 0.7) !important;
      transition: stroke 0.3s ease;
    }

    #search-pill:focus-within {
      border-color: rgba(255, 255, 255, 0.85);
      background: rgba(255, 255, 255, 0.08);
      box-shadow: 0 0 20px rgba(255, 255, 255, 0.1);
    }

    #search-pill:focus-within svg {
      stroke: #ffffff !important;
    }

    #search-input {
      flex: 1;
      background: none;
      border: none;
      outline: none;
      color: #ffffff;
      font-family: 'Inter', sans-serif;
      font-size: 0.95rem;
      font-weight: 300;
      letter-spacing: 0.02em;
    }

    #search-input::placeholder {
      color: rgba(255, 255, 255, 0.4);
    }

    #dropdown-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: all 0.3s ease;
    }

    #dropdown-btn:hover {
      background: rgba(255, 255, 255, 0.15);
      border-color: rgba(255, 255, 255, 0.5);
    }

    #dropdown-btn.open {
      transform: rotate(180deg);
      background: rgba(255, 255, 255, 0.2);
      border-color: rgba(255, 255, 255, 0.8);
    }

    #dropdown-btn svg {
      width: 14px;
      height: 14px;
    }

    #glacier-list {
      position: absolute;
      top: calc(100% + 10px);
      left: 0;
      right: 10%;
      /* Aligns with the 90% width of search-pill */
      background: rgba(10, 10, 12, 0.88);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 3px;
      max-height: 260px;
      overflow-y: auto;
      z-index: 100;
      display: none;
      backdrop-filter: blur(24px);
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.6);
    }

    #glacier-list.open {
      display: block;
    }

    #glacier-list::-webkit-scrollbar {
      width: 4px;
    }

    #glacier-list::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.25);
      border-radius: 4px;
    }

    .glacier-item {
      padding: 14px 22px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 3px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      transition: background 0.2s ease;
    }

    .glacier-item:last-child {
      border-bottom: none;
    }

    .glacier-item:hover {
      background: rgba(255, 255, 255, 0.08);
    }

    .glacier-item .gi-name {
      font-size: 0.9rem;
      color: rgba(255, 255, 255, 0.95);
      font-weight: 500;
      letter-spacing: 0.02em;
    }

    .glacier-item .gi-region {
      font-size: 0.75rem;
      color: rgba(255, 255, 255, 0.4);
    }

    .glacier-item.no-result {
      color: rgba(255, 255, 255, 0.4);
      font-size: 0.85rem;
      cursor: default;
      pointer-events: none;
      padding: 16px 22px;
    }

    .hint {
      margin-top: 28px;
      font-size: 0.75rem;
      color: rgba(255, 255, 255, 0.35);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      line-height: 2;
      animation: fadeUp 1.5s ease both;
    }

    .hint strong {
      color: rgba(255, 255, 255, 0.9);
      font-weight: 600;
    }

    /* ── RIGHT: Globe container ────────────── */
    #globe-viz {
      flex: 1;
      position: relative;
      overflow: hidden;
    }

    /* Inner div — globe renders here */
    #globe-inner {
      position: absolute;
      top: 0;
      left: -35%;
      width: 100%;
      height: 100%;
    }

    #globe-viz canvas,
    #globe-inner canvas {
      display: block;
    }

    /* ── HTML Marker elements ───────────── */
    .glacier-marker {
      width: 56px;
      height: 56px;
      cursor: pointer;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
    }

    .glacier-marker:hover .marker-dot {
      transform: scale(1.5);
      box-shadow: 0 0 14px rgba(255, 40, 40, 1), 0 0 30px rgba(255, 40, 40, 0.5);
    }

    .glacier-marker:hover .marker-label {
      opacity: 1;
    }

    .marker-dot {
      width: 11px;
      height: 11px;
      background: #ff2222;
      border-radius: 50%;
      box-shadow: 0 0 9px rgba(255, 50, 50, 0.9), 0 0 22px rgba(255, 50, 50, 0.45);
      position: absolute;
      z-index: 2;
      transition: transform 0.15s, box-shadow 0.15s;
    }

    .marker-ring {
      position: absolute;
      width: 11px;
      height: 11px;
      border: 2px solid rgba(255, 60, 60, 0.85);
      border-radius: 50%;
      animation: markerPulse 1.8s ease-out infinite;
    }

    .marker-ring:nth-child(2) {
      animation-delay: 0.9s;
    }

    .marker-label {
      position: absolute;
      bottom: calc(100% + 6px);
      left: 50%;
      transform: translateX(-50%);
      white-space: nowrap;
      background: rgba(4, 14, 36, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 3px;
      padding: 5px 11px;
      font-size: 0.72rem;
      color: #fff;
      font-family: 'Inter', sans-serif;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.18s;
      z-index: 10;
    }

    @keyframes markerPulse {
      0% {
        transform: scale(1);
        opacity: 0.85;
      }

      100% {
        transform: scale(5);
        opacity: 0;
      }
    }

    /* ── Zoom overlay (no flash — hidden permanently) ── */
    #zoom-overlay {
      display: none;
    }

    /* ── Selected marker state (during fly-to) ── */
    .marker-selected .marker-dot {
      transform: scale(2) !important;
      box-shadow: 0 0 10px rgba(255, 60, 60, 1), 0 0 22px rgba(255, 60, 60, 0.5) !important;
      transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.4s ease !important;
    }

    .marker-selected .marker-ring {
      animation-duration: 0.7s !important;
      border-color: rgba(255, 100, 100, 1) !important;
    }

    .marker-selected .marker-label {
      opacity: 1 !important;
    }

    /* ── Tooltip ─────────────────────────── */
    #tooltip {
      position: fixed;
      background: rgba(5, 5, 5, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 3px;
      padding: 10px 16px;
      pointer-events: none;
      display: none;
      z-index: 30;
      backdrop-filter: blur(12px);
      font-size: 0.82rem;
    }

    #tooltip .t-name {
      color: #fff;
      font-weight: 600;
      margin-bottom: 3px;
    }

    #tooltip .t-meta {
      color: var(--dim);
      font-size: 0.73rem;
    }

    #tooltip .t-cta {
      color: var(--accent);
      font-size: 0.70rem;
      margin-top: 6px;
      letter-spacing: 0.06em;
    }

    /* ── Animations ──────────────────────── */
    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(16px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>

<body>

  <!-- Full-page star background -->
  <canvas id="stars"></canvas>

  <div id="app">

    <!-- LEFT: Title + Search -->
    <div id="left-panel">
      <div class="logo">G.L.A.C.I.E.R.</div>
      <div class="fullform">Glacier Analytics &amp; Computational Inundation Early Warning Resource</div>
      <!-- <div class="separator"></div> -->

      <div id="search-wrap">
        <div id="search-pill">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="rgba(0,200,255,0.5)" stroke-width="2.2"
            stroke-linecap="round">
            <circle cx="11" cy="11" r="7" />
            <line x1="17" y1="17" x2="22" y2="22" />
          </svg>
          <input id="search-input" type="text" placeholder="Search Glacier..." autocomplete="off" spellcheck="false" />
          <button id="dropdown-btn" title="Show all glaciers">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"
              stroke-linejoin="round">
              <polyline points="6 9 12 15 18 9" />
            </svg>
          </button>
        </div>
        <div id="glacier-list"></div>
      </div>

    </div>

    <!-- RIGHT: Globe.gl -->
    <div id="globe-viz">
      <div id="globe-inner"></div>
    </div>

  </div>

  <!-- Transition overlay -->
  <div id="zoom-overlay"></div>

  <!-- Tooltip -->
  <div id="tooltip">
    <div class="t-name" id="tt-name"></div>
    <div class="t-meta" id="tt-meta"></div>
    <div class="t-cta">&#9654; Click to open simulation</div>
  </div>

  <script type="module" src="./src/landing.ts"></script>

</body>

</html>
